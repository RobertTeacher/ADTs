<style>
:root{
 --bg:#f3f5fa;--panel:#fff;--ink:#1a2333;--muted:#5a6578;--line:#dbe1ec;
 --code:#f7f8fc;--cur:#e08a00;--hl:#ffe9a8;--active:#3b66d1;--active-soft:#e2eaff;
 --ok:#0d8a7c;--ok-soft:#d6f2ee;--bad:#b84a4a;--bad-soft:#f9dddd;
 --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
 --body:Arial,Helvetica,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#0e131b;--panel:#151c27;--ink:#e5eaf3;--muted:#97a2b6;--line:#263040;
 --code:#111823;--cur:#f2b84b;--hl:#3d3112;--active:#7fa3ff;--active-soft:#1b2747;
 --ok:#3cc4b2;--ok-soft:#123631;--bad:#ff8a8a;--bad-soft:#3b2020;color-scheme:dark}}

.ctl input[type=range]{accent-color:var(--cur)}#scrub{flex:1 1 170px}.count{font:13px var(--mono);color:var(--muted)}

@media(max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}

<body>
<div class="wrap">
<header>
 <div><h1>Searching & Sorting Visualizer</h1><p class="sub">Unit 19 algorithms with iterative and recursive variants.</p></div>
 <div class="tabs" role="tablist">
  <button type="button" data-mode="linear" aria-selected="true">Linear Search</button>
  <button type="button" data-mode="binary" aria-selected="false">Binary Search</button>
  <button type="button" data-mode="bubble" aria-selected="false">Bubble Sort</button>
  <button type="button" data-mode="insertion" aria-selected="false">Insertion Sort</button>
  <button type="button" data-mode="recbinary" aria-selected="false">Recursive Binary</button>
  <button type="button" data-mode="recinsertion" aria-selected="false">Recursive Insertion</button>
 </div>
</header>

<div class="meta">
 <div class="card" id="complexity"></div>
 <div class="card" id="examtip"></div>
</div>

<div class="ctl">
 <button type="button" id="reset">⏮</button>
 <button type="button" id="prev">◀</button>
 <button type="button" class="primary" id="play">▶ Play</button>
 <button type="button" id="next">▶</button>
 <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
 <span class="count" id="count"></span>
 <label>Speed <input id="speed" type="range" min="1" max="5" value="3"></label>
</div>

<div class="grid">
 <div class="col">
  <div class="panel"><div class="pt"><span>Python code</span><span id="lineinfo"></span></div><div class="code" id="code"></div></div>
  <div class="panel caption" aria-live="polite"><span class="tag" id="tag"></span><p id="cap"></p></div>
 </div>
 <div class="col">
  <div class="panel">
   <div class="pt"><span>Array state</span><span id="status"></span></div>
   <div class="arr" id="arr"></div>
   <div class="ptrs" id="ptrs"></div>
   <div class="legend"><span><i style="background:var(--hl);border:2px solid var(--cur)"></i>current</span><span><i style="background:var(--active-soft);border:2px solid var(--active)"></i>compare/range</span><span><i style="background:var(--ok-soft);border:2px solid var(--ok)"></i>final/sorted</span></div>
  </div>
  <div class="two">
   <div class="panel"><div class="pt"><span>Variables</span></div><div id="vars"></div></div>
   <div class="panel"><div class="pt"><span>Recursive call stack</span></div><div id="stack"></div></div>
  </div>
 </div>

<script>
(()=>{
const root=document.querySelector(".wrap"); if(root.dataset.ready==="1")return; root.dataset.ready="1";
const $=id=>document.getElementById(id);
const DATA=[37,12,58,19,44,26,67,73];
const SORT=[29,10,14,37,13,8];

const CODE={
linear:[
"def LinearSearch(data, target):",
"    for index in range(len(data)):",
"        if data[index] == target:",
"            return index",
"    return -1"
],
binary:[
"def BinarySearch(data, target):",
"    low = 0",
"    high = len(data) - 1",
"    while low <= high:",
"        mid = (low + high) // 2",
"        if data[mid] == target:",
"            return mid",
"        elif data[mid] < target:",
"            low = mid + 1",
"        else:",
"            high = mid - 1",
"    return -1"
],
bubble:[
"def BubbleSort(data):",
"    end = len(data) - 1",
"    swapped = True",
"    while swapped and end > 0:",
"        swapped = False",
"        for j in range(end):",
"            if data[j] > data[j + 1]:",
"                temp = data[j]",
"                data[j] = data[j + 1]",
"                data[j + 1] = temp",
"                swapped = True",
"        end = end - 1",
"    return data"
],
insertion:[
"def InsertionSort(data):",
"    for i in range(1, len(data)):",
"        key = data[i]",
"        j = i - 1",
"        while j >= 0 and data[j] > key:",
"            data[j + 1] = data[j]",
"            j = j - 1",
"        data[j + 1] = key",
"    return data"
],
recbinary:[
"def RecursiveBinarySearch(data, target, low, high):",
"    if low > high:",
"        return -1",
"    mid = (low + high) // 2",
"    if data[mid] == target:",
"        return mid",
"    if target < data[mid]:",
"        return RecursiveBinarySearch(data, target, low, mid - 1)",
"    return RecursiveBinarySearch(data, target, mid + 1, high)"
],
recinsertion:[
"def RecursiveInsertionSort(data, numberItems):",
"    if numberItems <= 1:",
"        return data",
"    RecursiveInsertionSort(data, numberItems - 1)",
"    key = data[numberItems - 1]",
"    j = numberItems - 2",
"    while j >= 0 and data[j] > key:",
"        data[j + 1] = data[j]",
"        j = j - 1",
"    data[j + 1] = key",
"    return data"
]};

const META={
linear:{c:"<strong>Big O:</strong><p>Best O(1); average/worst O(n); extra space O(1).</p>",t:"<strong>Examiner focus:</strong><p>Do not return after the first non-match. Continue until the target is found or all relevant elements have been checked.</p>"},
binary:{c:"<strong>Big O:</strong><p>Best O(1); average/worst O(log n); iterative extra space O(1). Requires sorted data.</p>",t:"<strong>Examiner focus:</strong><p>Use <code>low <= high</code>, update bounds with <code>mid + 1</code> or <code>mid - 1</code>, and do not substitute a linear search when binary search is required.</p>"},
bubble:{c:"<strong>Big O:</strong><p>Optimised best O(n); average/worst O(n²); extra space O(1).</p>",t:"<strong>Examiner focus:</strong><p>Preserve the required sort. Use a decreasing boundary and, when the algorithm includes it, terminate early when no swaps occur.</p>"},
insertion:{c:"<strong>Big O:</strong><p>Best O(n); average/worst O(n²); extra space O(1).</p>",t:"<strong>Examiner focus:</strong><p>Store the key, shift larger items to the right, then place the key once. Do not replace insertion sort with bubble sort.</p>"},
recbinary:{c:"<strong>Big O:</strong><p>Best O(1); average/worst O(log n); recursive stack O(log n) for a balanced search range.</p>",t:"<strong>Exam focus:</strong><p>A recursive solution still needs a base case and must reduce the search range on every call.</p>"},
recinsertion:{c:"<strong>Big O:</strong><p>Best O(n); average/worst O(n²); recursive stack O(n).</p>",t:"<strong>Exam focus:</strong><p>The recursive call sorts the first n−1 items; the insertion step then places the final item into that sorted section.</p>"}
};

function state(arr,line,tag,msg,vars={},mark={},stack=[]){return {arr:arr.slice(),line,tag,msg,vars:{...vars},mark:{...mark},stack:stack.map(x=>({...x}))}}
function genLinear(target=44){
 const a=DATA.slice(),s=[];
 for(let i=0;i<a.length;i++){
  s.push(state(a,2,"loop",`Check index ${i}.`,{index:i,target},{cur:i}));
  s.push(state(a,3,"compare",`${a[i]} ${a[i]===target?"equals":"does not equal"} ${target}.`,{index:i,target},{cmp:i}));
  if(a[i]===target){s.push(state(a,4,"return",`Target found at index ${i}.`,{index:i,target},{done:[i]}));return s}
 }
 s.push(state(a,5,"return","Target not found. Return -1.",{target},{discard:[...a.keys()]})); return s
}
function genBinary(target=44,recursive=false){
 const a=DATA.slice().sort((x,y)=>x-y),s=[]; let low=0,high=a.length-1; const stack=[];
 if(recursive){
  function rec(l,h,depth){
   stack.push({low:l,high:h,depth}); s.push(state(a,1,"call",`Recursive call with low=${l}, high=${h}.`,{low:l,high:h,target},{range:[l,h]},stack));
   if(l>h){s.push(state(a,2,"base case","low > high, so return -1.",{low:l,high:h,target},{},stack));stack.pop();return -1}
   const m=Math.floor((l+h)/2);
   s.push(state(a,4,"mid",`mid = ${m}; data[mid] = ${a[m]}.`,{low:l,high:h,mid:m,target},{range:[l,h],cur:m},stack));
   s.push(state(a,5,"compare",`Compare ${a[m]} with ${target}.`,{low:l,high:h,mid:m,target},{range:[l,h],cmp:m},stack));
   if(a[m]===target){s.push(state(a,6,"return",`Found target at index ${m}.`,{low:l,high:h,mid:m,target},{done:[m]},stack));stack.pop();return m}
   let ans;
   s.push(state(a,7,"compare",`Is target ${target} < data[mid] ${a[m]}? ${target<a[m]?"Yes.":"No."}`,{low:l,high:h,mid:m,target},{range:[l,h],cmp:m},stack));
   if(target<a[m]){
     s.push(state(a,8,"recursive call","Recurse on the left half using high = mid - 1.",{low:l,high:h,mid:m,target},{range:[l,m-1],discard:[...Array(h-m+1).keys()].map(x=>m+x)},stack));
     ans=rec(l,m-1,depth+1)
   }else{
     s.push(state(a,9,"recursive call","Recurse on the right half using low = mid + 1.",{low:l,high:h,mid:m,target},{range:[m+1,h],discard:[...Array(m-l+1).keys()].map(x=>l+x)},stack));
     ans=rec(m+1,h,depth+1)
   }
   s.push(state(a,target<a[m]?8:9,"unwind",`Return ${ans} to the previous recursive call.`,{low:l,high:h,mid:m,target},{},stack));stack.pop();return ans
  }
  rec(low,high,0); return s
 }
 s.push(state(a,2,"assign","low = 0.",{low,high,target},{range:[low,high]}));
 s.push(state(a,3,"assign",`high = ${high}.`,{low,high,target},{range:[low,high]}));
 while(low<=high){
  s.push(state(a,4,"loop",`Search range is index ${low} to ${high}.`,{low,high,target},{range:[low,high]}));
  const mid=Math.floor((low+high)/2);s.push(state(a,5,"mid",`mid = ${mid}; data[mid] = ${a[mid]}.`,{low,high,mid,target},{range:[low,high],cur:mid}));
  if(a[mid]===target){s.push(state(a,6,"compare","Values match.",{low,high,mid,target},{done:[mid]}));s.push(state(a,7,"return",`Return ${mid}.`,{low,high,mid,target},{done:[mid]}));return s}
  if(a[mid]<target){
   s.push(state(a,8,"compare",`${a[mid]} < ${target}; discard the left half including mid.`,{low,high,mid,target},{discard:[...Array(mid-low+1).keys()].map(x=>low+x)}));
   low=mid+1;s.push(state(a,9,"update",`low = mid + 1 = ${low}.`,{low,high,mid,target},{range:[low,high]}));
  }else{
   s.push(state(a,10,"compare",`${a[mid]} > ${target}; discard the right half including mid.`,{low,high,mid,target},{discard:[...Array(high-mid+1).keys()].map(x=>mid+x)}));
   high=mid-1;s.push(state(a,11,"update",`high = mid - 1 = ${high}.`,{low,high,mid,target},{range:[low,high]}));
  }
 }
 s.push(state(a,12,"return","Search range is empty. Return -1.",{low,high,target},{}));return s
}
function genBubble(){
 const a=SORT.slice(),s=[];let end=a.length-1,swapped=true;
 s.push(state(a,2,"assign",`end = ${end}.`,{end,swapped},{done:[]}));
 s.push(state(a,3,"assign","swapped = True.",{end,swapped},{}));
 while(swapped&&end>0){
  s.push(state(a,4,"pass",`Start a pass up to index ${end}.`,{end,swapped},{done:[...Array(a.length-end-1).keys()].map(x=>a.length-1-x)}));
  swapped=false;s.push(state(a,5,"reset","Assume no swap is needed in this pass.",{end,swapped},{}));
  for(let j=0;j<end;j++){
   s.push(state(a,6,"loop",`Compare positions ${j} and ${j+1}.`,{j,end,swapped},{cmp:[j,j+1]}));
   s.push(state(a,7,"compare",`${a[j]} ${a[j]>a[j+1]?">":"≤"} ${a[j+1]}.`,{j,end,swapped},{cmp:[j,j+1]}));
   if(a[j]>a[j+1]){
    const tmp=a[j];s.push(state(a,8,"temporary",`temp = ${tmp}.`,{j,end,swapped,temp:tmp},{cmp:[j,j+1]}));
    a[j]=a[j+1];s.push(state(a,9,"shift",`Move smaller value left.`,{j,end,swapped,temp:tmp},{cur:j}));
    a[j+1]=tmp;s.push(state(a,10,"swap",`Place ${tmp} at index ${j+1}.`,{j,end,swapped,temp:tmp},{cur:j+1}));
    swapped=true;s.push(state(a,11,"flag","A swap occurred, so another pass may be needed.",{j,end,swapped},{cmp:[j,j+1]}));
   }
  }
  s.push(state(a,12,"pass complete",`Index ${end} is now fixed.`,{end,swapped},{done:[...Array(a.length-end).keys()].map(x=>end+x)}));
  end--;s.push(state(a,12,"boundary",`Decrease the unsorted boundary to ${end}.`,{end,swapped},{done:[...Array(a.length-end-1).keys()].map(x=>end+1+x)}));
 }
 s.push(state(a,13,"return","Sorting complete.",{end,swapped},{done:[...a.keys()]}));return s
}
function genInsertion(recursive=false){
 const a=SORT.slice(),s=[]; const stack=[];
 function insertAt(i,lineBase=2){
  let key=a[i],j=i-1;
  s.push(state(a,recursive?5:3,"key",`Store key = ${key} from index ${i}.`,{i,key,j},{key:i,done:[...Array(i).keys()]},stack));
  s.push(state(a,recursive?6:4,"index",`j = ${j}.`,{i,key,j},{key:i,done:[...Array(i).keys()]},stack));
  while(j>=0&&a[j]>key){
   s.push(state(a,recursive?7:5,"compare",`${a[j]} > key ${key}; shift it right.`,{i,key,j},{cmp:[j,j+1],done:[...Array(i).keys()]},stack));
   a[j+1]=a[j];s.push(state(a,recursive?8:6,"shift",`Move ${a[j]} to index ${j+1}.`,{i,key,j},{cur:j+1},stack));
   j--;s.push(state(a,recursive?9:7,"move",`Move j left to ${j}.`,{i,key,j},{},stack));
  }
  a[j+1]=key;s.push(state(a,recursive?10:8,"insert",`Insert key ${key} at index ${j+1}.`,{i,key,j},{done:[...Array(i+1).keys()],cur:j+1},stack));
 }
 if(!recursive){
  for(let i=1;i<a.length;i++){s.push(state(a,2,"loop",`Insert element at index ${i} into the sorted left section.`,{i},{done:[...Array(i).keys()]}));insertAt(i)}
  s.push(state(a,9,"return","Sorting complete.",{},{done:[...a.keys()]}));return s
 }
 function rec(n){
  stack.push({numberItems:n});
  s.push(state(a,1,"call",`RecursiveInsertionSort(data, ${n}).`,{numberItems:n},{done:[...Array(Math.max(0,n-1)).keys()]},stack));
  if(n<=1){s.push(state(a,2,"base case","numberItems <= 1. One item is already sorted.",{numberItems:n},{done:[0]},stack));s.push(state(a,3,"return","Return to the previous call.",{numberItems:n},{done:[0]},stack));stack.pop();return}
  s.push(state(a,4,"recursive call",`First sort the first ${n-1} items.`,{numberItems:n},{},stack));
  rec(n-1);
  s.push(state(a,4,"unwind",`The first ${n-1} items are sorted. Continue this call.`,{numberItems:n},{done:[...Array(n-1).keys()]},stack));
  insertAt(n-1);
  s.push(state(a,11,"return",`Return after placing item ${n}.`,{numberItems:n},{done:[...Array(n).keys()]},stack));
  stack.pop()
 }
 rec(a.length);return s
}

const STEPS={
 linear:genLinear(),
 binary:genBinary(44,false),
 bubble:genBubble(),
 insertion:genInsertion(false),
 recbinary:genBinary(44,true),
 recinsertion:genInsertion(true)
};
let mode="linear",idx=0,timer=null; const SPEED=[1900,1300,850,520,300];

function renderCode(){
 $("code").innerHTML=CODE[mode].map((x,i)=>`<div class="ln" data-l="${i+1}"><span class="n">${i+1}</span><span>${x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")||" "}</span></div>`).join("")
}
function render(){
 const s=STEPS[mode][idx];
 document.querySelectorAll(".ln").forEach(el=>el.classList.toggle("on",+el.dataset.l===s.line));
 const on=document.querySelector(".ln.on");if(on){const b=$("code"),t=on.offsetTop-b.offsetTop;if(t<b.scrollTop||t>b.scrollTop+b.clientHeight-25)b.scrollTop=Math.max(0,t-60)}
 $("lineinfo").textContent=`line ${s.line}`;$("tag").textContent=`line ${s.line} · ${s.tag}`;$("cap").textContent=s.msg;
 $("count").textContent=`${idx+1} / ${STEPS[mode].length}`;$("scrub").max=STEPS[mode].length-1;$("scrub").value=idx;
 $("complexity").innerHTML=META[mode].c;$("examtip").innerHTML=META[mode].t;
 const max=Math.max(...s.arr);
 const mark=s.mark||{};const done=new Set(mark.done||[]),discard=new Set(mark.discard||[]),cmp=new Set(Array.isArray(mark.cmp)?mark.cmp:mark.cmp!=null?[mark.cmp]:[]),range=mark.range||null;
 $("arr").innerHTML=s.arr.map((v,i)=>{
   let cls="cell";if(done.has(i))cls+=" done";if(discard.has(i))cls+=" discard";if(cmp.has(i))cls+=" compare";if(mark.cur===i)cls+=" current";if(mark.key===i)cls+=" key";
   if(range && (i<range[0]||i>range[1])) cls+=" discard";
   return `<div class="${cls}"><div class="bar" style="height:${18+Math.round(v/max*55)}px"></div><span class="val">${v}</span><span class="idx">index ${i}</span></div>`
 }).join("");
 $("ptrs").innerHTML=Object.entries(s.vars).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("");
 $("vars").innerHTML='<dl class="vars">'+Object.entries(s.vars).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")+'</dl>';
 $("stack").innerHTML=s.stack&&s.stack.length?'<div class="stack">'+s.stack.slice().reverse().map((f,i)=>`<div class="frame ${i===0?"top":""}">${Object.entries(f).map(([k,v])=>`${k}=${v}`).join(", ")}</div>`).join("")+'</div>':'<span style="color:var(--muted);font-size:13px">No recursive calls active.</span>';
 $("status").textContent=mode.includes("binary")?"sorted data":"";
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ Play"}
function step(d){idx=Math.max(0,Math.min(STEPS[mode].length-1,idx+d));render();if(idx===STEPS[mode].length-1)stop()}
function play(){if(idx===STEPS[mode].length-1)idx=0;$("play").textContent="❚❚ Pause";timer=setInterval(()=>step(1),SPEED[$("speed").value-1])}
function setMode(m){stop();mode=m;idx=0;document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.mode===m)));renderCode();render()}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("reset").addEventListener("click",()=>{stop();idx=0;render()});$("prev").addEventListener("click",()=>{stop();step(-1)});$("next").addEventListener("click",()=>{stop();step(1)});$("play").addEventListener("click",()=>timer?stop():play());$("scrub").addEventListener("input",e=>{stop();idx=+e.target.value;render()});$("speed").addEventListener("input",()=>{if(timer){stop();play()}});
const p=new URLSearchParams(location.search);if(p.get("embedded")==="1")document.body.classList.add("embedded");const req=p.get("mode");setMode(Object.hasOwn(STEPS,req)?req:"linear");
})();
</script>
</body>
